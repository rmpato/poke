<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158" viewBox="0 0 560 158"
     font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace"
     role="img" aria-label="pogo — curl, but it remembers">
  <defs>
    <!-- Blue into green: the same ramp the UI draws its rule and its meters
         with, so the mark and the tool are the same object. -->
    <linearGradient id="pogo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E86F0"/>
      <stop offset="100%" stop-color="#3FB950"/>
    </linearGradient>
  </defs>

  <rect width="560" height="158" rx="10" fill="#14161c"/>

  <!-- The mark is a prompt, because that is where the tool lives. -->
  <text x="280" y="74" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="1">
    <tspan fill="#5c6370">$ </tspan><tspan fill="url(#pogo)">pogo</tspan><tspan fill="#D29922">▌</tspan>
  </text>

  <line x1="176" y1="96" x2="384" y2="96" stroke="#23262e" stroke-width="1"/>

  <text x="280" y="120" text-anchor="middle" font-size="15" fill="#8b909a" letter-spacing="0.4">
    curl, but it remembers
  </text>
  <text x="280" y="142" text-anchor="middle" font-size="12" fill="#5c6370" letter-spacing="0.4">
    HTTP-aware history for your terminal
  </text>
</svg>
