name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # poke shells out to curl, so it is tested on both platforms it targets.
        # The oldest Go version here is the one declared in go.mod, which the
        # Charm libraries pin to 1.24.
        os: [ubuntu-latest, macos-latest]
        go: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: curl version
        run: curl --version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "These files need gofmt -s -w:"
            echo "$files"
            exit 1
          fi

      - name: go mod tidy is clean
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod/go.sum are not tidy. Run: go mod tidy"
            git diff --stat go.mod go.sum
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  # The curl option table is generated, not hand-written. If it drifts from what
  # curl actually reports, the metadata poke records starts to lie.
  generated:
    name: generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Option table matches this curl
        run: go test ./internal/curlargs/ -run TestOptionTableMatchesLocalCurl -v
