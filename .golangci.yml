# Linters are here to catch real defects, not to enforce taste. Anything that
# would mostly produce churn on a small codebase is left off deliberately.
version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert
    - copyloopvar

  settings:
    misspell:
      # US spelling, matching the Go standard library and the identifiers
      # already in this codebase (Favorite, Unrecognized, normalize).
      locale: US

    errcheck:
      # Writing to a terminal is best-effort: if stdout is gone there is nowhere
      # to report that stdout is gone.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString

  exclusions:
    rules:
      # Tests may ignore errors from helpers where the assertion is the point.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
