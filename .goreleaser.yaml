version: 2

project_name: pogo

before:
  hooks:
    - go mod tidy

builds:
  - id: pogo
    main: ./cmd/pogo
    binary: pogo
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/rmpato/pogo/internal/version.Version={{.Version}}
      - -X github.com/rmpato/pogo/internal/version.Commit={{.ShortCommit}}

archives:
  - id: default
    ids: [pogo]
    formats: [tar.gz]
    name_template: "pogo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # The prose docs travel with the binary; the screenshots and the landing
      # page do not need to be in a binary archive.
      - README.md
      - LICENSE
      - docs/*.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request

release:
  draft: false
  prerelease: auto
  footer: |
    ## Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/rmpato/pogo/main/install.sh | sh
    ```

    or, if you have Go:

    ```bash
    go install github.com/rmpato/pogo/cmd/pogo@{{ .Tag }}
    ```

    Already installed? `pogo update`
